function frame(t) {
  const dk = darkAt(t, DARK);
  chromeAt(C, t, T, dk);
  capsAt(caps, t);

  // S0
  if (gz(g0, t, B[0], B[1], { first: true })) {

    const bob = Math.sin(t * 2.3) * 10;

    st(aiGlow, { op: pr(t, .5, .8) * (.85 + .15 * Math.sin(t * 2)), y: bob });
    aiR.style.opacity = pr(t, .7, .5); aiR.style.transform = `translate(-50%,-50%) translateY(${bob}px) rotateX(70deg) rotateZ(${t * 60}deg)`;
    // thought: ? then ✓
    const tq = pop(thought, t, 1.1, { s0: .3, y: Math.sin(t * 3) * 6 });
    thought.textContent = t < 7.25 ? '؟' : '✓';
    thought.style.color = t < 7.25 ? '#E08A3C' : '#92B43B';
    if (t > 7.15 && t < 7.35) thought.style.transform += ` scale(${1 - .3 * Math.sin(Math.PI * (t - 7.15) / .2)})`;
    // pillar rises 2.85→3.1, sinks 6.6→7.0
    const up = pr(t, 2.85, .28, 'back'), down = pr(t, 6.6, .4, 'io');
    pillar.style.transform = `translateY(${(1 - up) * 720 + down * 720}px)`;
    pw.style.opacity = 1; pw.style.transform = `translate(-50%,-50%) translateX(${t > 3.1 && t < 3.35 ? Math.sin(t * 120) * 6 : 0}px)`;
    const shakeCam = (t > 3.0 && t < 3.3) || (t > 6.6 && t < 6.9) ? Math.sin(t * 140) * 7 : 0;
    w0.style.transform += ` translateY(${shakeCam}px)`;
    DUST.forEach(d => { const bursts = [3.0, 6.75]; let op = 0, x = 0, y = 0, s = 1; for (const b of bursts) { if (t > b && t < b + .9) { const u = t - b; op = 1 - u / .9; x = d.vx * u; y = d.vy * u + 300 * u * u; s = d.s * (1 + u); } } st(d.el, { op: op * .8, x, y, s }); });
    // messages bounce off the pillar
    msgs.forEach((m, i) => {
      const a = i ? 4.25 : 3.6, hit = a + .4;
      if (t < a || t > hit + .9) { m.style.opacity = 0; return; }
      if (t < hit) { const k = pr(t, a, .4, 'lin'); st(m, { op: 1, x: L(0, -40, k), y: -60 * Math.sin(Math.PI * k) - 40, s: L(.6, 1, k) * (i ? .8 : 1) }); }
      else { const u = t - hit; st(m, { op: 1 - u / .9, x: -40 + 260 * u, y: -40 + 800 * u * u - 160 * u, r: 140 * u, s: i ? .8 : 1 }); }
    });
    const hx = Math.max(pr(t, 4.0, .2) * (1 - pr(t, 4.4, .2)), pr(t, 4.65, .2) * (1 - pr(t, 5.0, .2)));
    st(hitX, { op: hx, s: L(.5, 1, hx), y: -40 });
    // the diploma arrives and pushes the pillar down
    const mk = pr(t, 5.35, .55, 'back');
    const press = pr(t, 6.45, .25, 'io');
    st(mark, { op: t < 5.35 ? 0 : pr(t, 5.35, .25) * (1 - pr(t, 7.6, .3)), x: L(-420, 0, mk), y: L(-420, 0, mk) + press * 110 - pr(t, 6.9, .4) * 60, s: L(.4, 1, mk) * L(1, .9, press), r: L(-30, 0, mk) });
    // bridge + flow
    bridge.style.opacity = 1; bridge.style.transform = 'translate(-50%,-50%)';
    bpath.style.strokeDashoffset = 1 - pr(t, 7.0, .4);
    const len = bpath.getTotalLength();
    FLOW.forEach((f, i) => { const u = ((t - 7.35 - i * .18) / .7); if (u < 0 || t < 7.35) { f.style.opacity = 0; return; } const q = u % 1; const dir = i % 2 ? q : 1 - q; const p = bpath.getPointAtLength(len * dir); f.style.left = p.x + 'px'; f.style.top = (p.y + 900 - 200) + 'px'; st(f, { op: Math.sin(Math.PI * q) }); });

  // S1 — five quick cuts
  if (gz(g1, t, B[1], B[2])) {
    const SB1 = [8.0, 10.75, 12.3, 13.85, 15.45, 17.5];
    s1.forEach((el, i) => sub(el, t, SB1[i], SB1[i + 1], { first: i === 0, last: i === 4 }));
    // 1a

  // S3
  if (gz(g3, t, B[3], B[4])) {

    const kT = pr(t, 23.2, .9, 'out');

    PTS.forEach(p => { const k = pr(t, 22.9 + p.d * .5, 1.3, 'io'); st(p.el, { op: k < .98 ? cl(k * 3) : 1 - pr(t, 24.4, .4), x: L(p.x, p.tx, k), y: L(p.y, p.ty, k), s: L(1.6, .6, k) }); });

  }

  // S4
  if (gz(g4, t, B[4], B[5])) {
    const k = pr(t, 26.7, 1.0, 'out');
    ph.style.opacity = k;
    ph.style.transform = `translate(-50%,-50%) translateY(${(1 - k) * 300}px) rotateY(${L(-32, -10, pr(t, 26.7, 7.5, 'io'))}deg) rotateX(${L(14, 4, k)}deg) rotateZ(${L(4, 0, k)}deg)`;
    st(phGlow, { op: k * (.8 + .2 * Math.sin(t * 2)) });

    else seq(pimg, 'A_task', t, 30.8);
    CO.forEach(c => rv(c.el, t, c.a, { dx: -120, dy: 0, d: .5 }));
  }

  // S5
  if (gz(g5, t, B[5], B[6])) {
    cam(w5, 0, 0, L(1.08, 1, pr(t, 34.2, 6, 'out')));
    DP.forEach(p => {
      const k = pr(t, 34.7 + p.d * .7, 1.0, 'io');
      const drift = (1 - k) * 30 * Math.sin(t * 1.5 + p.d * 9);
      const wave = pr(t, 38.84 + p.dist / 900, .3);

      st(el, { op: pr(t, 34.25 + p.d * .3, .3), x: L(p.sx, p.x, k) + drift, y: L(p.sy, p.y, k), s: 1 + .5 * Math.sin(Math.PI * wave) });
      if (wave > .5) el.style.background = '#92B43B';
    });
    rv(grads, t, 36.5, { dy: 30 });
  }

  // S6
  if (gz(g6, t, B[6], B[7], { last: true })) {
    const k = pr(t, 41.95, .45, 'back');
    st(slam, { op: pr(t, 41.95, .12), s: L(2.4, 1, k), r: L(-12, -3, k) });
    const sh = t > 42.1 && t < 42.4 ? Math.sin(t * 110) * 10 : 0;

    commentAt(cb, t, 43.31, 'مهتم', 43.55, 44.15);
    const pk = pr(t, 44.15, .7, 'io');

    pop(rp, t, 44.6, { s0: .6, y: Math.sin(t * 2) * 4 });
  }
}
