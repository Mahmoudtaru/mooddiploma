<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>A — الحاجز</title>
<link rel="stylesheet" href="engine.css">
<style>
.world{position:absolute;inset:0}
.orbA{width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#eaf9b4 0%,#b7d85a 22%,#92B43B 45%,#4d6d1c 78%,#2c3f10 100%);box-shadow:0 0 120px rgba(146,180,59,.55),0 0 260px rgba(146,180,59,.25);display:flex;align-items:center;justify-content:center}
.orbA svg{width:150px;height:150px;fill:rgba(255,255,255,.92);stroke:none}
.ring{border-radius:50%;border:4px solid rgba(185,221,91,.55)}
.pane{width:940px;height:1040px;border-radius:44px;background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.04) 45%,rgba(255,255,255,.10));border:3px solid rgba(255,255,255,.42);backdrop-filter:blur(26px) saturate(.6);-webkit-backdrop-filter:blur(26px) saturate(.6);box-shadow:inset 0 0 80px rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.35);overflow:hidden}
.sheen{position:absolute;top:-20%;width:180px;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(18deg)}
.shard{background:linear-gradient(155deg,rgba(255,255,255,.55),rgba(220,232,245,.18));border:2px solid rgba(255,255,255,.7)}
.ripple{width:60px;height:60px;border-radius:50%;border:5px solid rgba(255,255,255,.8)}
.cursor svg{width:110px;height:110px;fill:#fff;stroke:#141C29;stroke-width:1.2}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}
.tile{width:330px;height:300px;padding:26px;display:flex;flex-direction:column;gap:16px}
.tile .tt{font:800 36px Cairo;display:flex;align-items:center;gap:14px;white-space:nowrap}
.tile .tt .ic{width:64px;height:64px;border-radius:20px}.tile .tt .ic svg{width:38px;height:38px}
.slot{width:330px;height:300px;border-radius:34px;border:4px dashed rgba(30,45,68,.18)}
.sbar{height:52px;border-radius:26px;background:#F1EEE6;display:flex;align-items:center;padding:0 18px;font:700 26px Cairo;color:#8A93A3;gap:10px}
.res{height:20px;border-radius:10px;background:#E9E5DA}
.knob{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid var(--green);transform:translate(-50%,-50%)}
.trk{position:relative;height:12px;border-radius:6px;background:#ECE8DD}
.trk i{position:absolute;right:0;top:0;bottom:0;border-radius:6px;background:var(--green);display:block}
.tsk{display:flex;align-items:center;gap:14px}
.tsk .bx{width:40px;height:40px;border-radius:12px;border:3px solid #D5D0C4;display:flex;align-items:center;justify-content:center;flex:none}
.tsk .bx svg{width:26px;height:26px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.blk{border-radius:18px}
.art{width:900px;height:640px;border-radius:40px;background:#fff;box-shadow:0 40px 100px rgba(20,28,41,.14);border:2px solid #EFEBE1}
.genT{font:900 168px/1 Cairo;direction:ltr;white-space:nowrap;background:linear-gradient(100deg,#FBF9F4 0%,#FBF9F4 35%,#d8f08a 48%,#92B43B 55%,#FBF9F4 68%,#FBF9F4 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.genA{font:900 74px/1.2 Cairo;color:#92B43B;white-space:nowrap}
.pt{width:12px;height:12px;border-radius:50%;background:#B9DD5B}
.orbI{width:120px;height:120px;border-radius:36px;background:#1B273B;border:2px solid #2A3A55;display:flex;align-items:center;justify-content:center}
.orbI svg{width:60px;height:60px;stroke:#B9DD5B;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.p3d{perspective:2000px}
.callout{font:800 38px Cairo;padding:20px 30px;border-radius:999px;background:#fff;border:2px solid #EFEBE1;box-shadow:0 18px 40px rgba(20,28,41,.12);display:flex;align-items:center;gap:16px;white-space:nowrap}
.callout .ck{width:48px;height:48px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.callout .ck svg{width:28px;height:28px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dotP{width:15px;height:15px;border-radius:50%}
.slam{font:900 118px Cairo;padding:30px 70px;border-radius:44px;background:var(--green);color:#fff;white-space:nowrap;box-shadow:0 30px 80px rgba(146,180,59,.45)}
.plane svg{width:70px;height:70px;stroke:#B9DD5B;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div id="stage"></div>
<script src="engine.js"></script>
<script>
const T = 47.3;
const B = [0, 8.0, 17.5, 22.6, 26.6, 34.2, 41.1, T];
const DARK = [[0, 1], [7.15, 0], [22.6, 1], [26.6, 0], [34.2, 1]];
const MUSIC = { style: 'A', drop: 7.05 };
const CLIPS = {
  A_vibe: { src: 'L', t0: 18, t1: 24, dur: 2.6, w: 900 },
  A_list: { src: 'P', t0: 9, t1: 15, dur: 2.0 },
  A_book: { src: 'P', t0: 36, t1: 44, dur: 1.9 },
  A_task: { src: 'P', t0: 51, t1: 60, dur: 3.6 },
};
const CUES = [[3.0, 'pop'], [3.9, 'tick'], [4.35, 'tick'], [6.6, 'crack'], [7.05, 'shatter'],
  [8.0, 'whoosh'], [17.5, 'whoosh'], [22.6, 'whoosh'], [26.6, 'whoosh'], [34.2, 'whoosh'], [41.1, 'whoosh'], [41.95, 'pop'], [44.15, 'ding']];
const CAPS = [
  ['نفسك تستخدم الـ AI باحترافية،', .25, 2.3], ['بس حاسس إن في حاجز بينك وبينه؟', 2.3, 4.44],
  ['في دبلومة Smarter With AI،', 5.32, 6.45], ['الحاجز ده هيتشال.', 6.45, 7.6],
  ['وهتعرف إزاي توظفه صح', 8.1, 9.35], ['في كل حاجة تخصك', 9.35, 10.48],
  ['زي إنه يبحث معاك،', 10.92, 12.06], ['يساعدك تتعلم أسرع،', 12.45, 13.63],
  ['أو حتى تعلّمه طريقتك في شغلك،', 13.92, 15.55], ['بحيث ينفذ تاسكات مكانك.', 15.55, 17.19],
  ['ممكن كمان يساعدك في صناعة', 17.8, 19.2], ['الفيديوهات والتصميمات الاحترافية،', 19.2, 20.69],
  ['لحد موقعك الخاص.', 21.14, 22.24], ['ببساطة هنعلمك كل حاجة', 22.97, 24.8], ['عن الذكاء الاصطناعي التوليدي.', 24.8, 26.23],
  ['من خلال محاضرات معمولة مخصوص،', 26.96, 28.7], ['كل فيديو معاه كتيب تطبق منه،', 28.7, 30.61],
  ['متابعة مستمرة،', 30.83, 31.82], ['وأسئلتك دايمًا مرحب بيها.', 32.23, 33.77],
  ['انضم لأكتر من ٣٠٠ خريج', 34.57, 36.5], ['من مجالات مختلفة، جربوا الرحلة دي معانا،', 36.5, 38.39],
  ['وبقوا أذكى في استخدام الذكاء الاصطناعي.', 38.84, 40.65],
  ['الدبلومة عليها خصم دلوقتي…', 41.46, 42.74], ['اكتب «مهتم»،', 43.31, 44.18], ['وهنبعتلك تفاصيل الدبلومة.', 44.39, 45.74],
];
const stage = document.getElementById('stage');
const C = chrome(stage);
const G = B.slice(0, -1).map(() => $(stage, 'grp'));
const caps = captions(stage, CAPS);
const flash = $(stage, 'flash');
let s_ = 5; const rnd = () => (s_ = (s_ * 9301 + 49297) % 233280) / 233280;

// zoom-style group transition
function gz(g, t, a, b, { first = false, last = false } = {}) {
  const din = .6, dout = .55;
  if (t < a - din * .5 || t > b + dout * .5) { g.style.display = 'none'; return false; }
  g.style.display = 'block';
  const ki = first ? 1 : pr(t, a - din * .5, din, 'io');
  const ko = last ? 0 : pr(t, b - dout * .5, dout, 'io');
  const s = L(1.18, 1, ki) * L(1, 1.5, ko);
  g.style.opacity = cl(Math.min(ki, 1 - ko) * 1.2);
  g.style.transform = `scale(${s})`;
  const bl = (1 - ki) * 14 + ko * 18;
  g.style.filter = bl > .3 ? `blur(${bl}px)` : 'none';
  return true;
}

// ===== S0 — the barrier =====
const g0 = G[0]; const w0 = $(g0, 'world');
const glow0 = A(w0, 540, 860, 'glow', '', { width: '760px', height: '760px', background: 'rgba(146,180,59,.35)' });
const r1 = A(w0, 540, 860, 'ring', '', { width: '640px', height: '640px' });
const r2 = A(w0, 540, 860, 'ring', '', { width: '780px', height: '780px', borderColor: 'rgba(185,221,91,.25)' });
const orb = A(w0, 540, 860, 'orbA', svg('spark'));
const pane = A(w0, 540, 860, 'pane', `<div class="sheen"></div><svg width="940" height="1040" viewBox="0 0 940 1040" style="position:absolute;inset:0"><path id="cr" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" d="M470 520 L330 300 L250 40 M470 520 L640 330 L760 0 M470 520 L760 560 L940 520 M470 520 L640 760 L700 1040 M470 520 L300 780 L180 1040 M470 520 L150 560 L0 600 M330 300 L520 250 M640 330 L760 560 M640 760 L300 780 M150 560 L330 300"/></svg>`);
const curs = A(w0, 640, 1160, 'cursor', `<svg viewBox="0 0 24 24"><path d="M5 2l14 10-6 1.5 3.5 7-3 1.5-3.5-7L5 19z"/></svg>`);
const rips = [0, 1].map(() => A(w0, 600, 1110, 'ripple'));
const markBig = A(w0, 540, 860, '', '<img src="assets/mark.png" style="width:460px;filter:drop-shadow(0 20px 50px rgba(0,0,0,.4))">');
const SH = [];
{ // radial fan shards
  const cx = 470, cy = 520, R = 900, n = 26;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2 + rnd() * .1, a1 = ((i + 1) / n) * Math.PI * 2;
    const rIn = 40 + rnd() * 120;
    const pts = [[cx + Math.cos(a0) * rIn, cy + Math.sin(a0) * rIn], [cx + Math.cos(a0) * R, cy + Math.sin(a0) * R], [cx + Math.cos(a1) * R, cy + Math.sin(a1) * R], [cx + Math.cos(a1) * rIn, cy + Math.sin(a1) * rIn]];
    const el = A(w0, 540, 860, 'shard', '', { width: '940px', height: '1040px', clipPath: `polygon(${pts.map(([x, y]) => `${Math.max(0, Math.min(940, x))}px ${Math.max(0, Math.min(1040, y))}px`).join(',')})` });
    const am = (a0 + a1) / 2;
    SH.push({ el, vx: Math.cos(am) * (700 + rnd() * 600), vy: Math.sin(am) * (700 + rnd() * 600) - 200, vr: (rnd() - .5) * 220, vs: 1.4 + rnd() * 1.6 });
  }
}
const shock = [0, 1, 2].map(i => A(w0, 540, 860, 'ring', '', { width: '440px', height: '440px', borderWidth: '8px', borderColor: '#92B43B' }));

// ===== S1 — AI hub with four capabilities =====
const g1 = G[1]; const w1 = $(g1, 'world');
const P1 = { c: [540, 830], t: [540, 470], r: [855, 830], b: [540, 1190], l: [225, 830] };
const hubLines = A(w1, 540, 830, '', `<svg width="1080" height="1000" viewBox="0 0 1080 1000">${[[540, 140], [855, 500], [540, 860], [225, 500]].map(([x, y], i) => `<path class="hl" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M540 500 L${x} ${y}" stroke="#92B43B" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/>`).join('')}</svg>`);
const hubGlow = A(w1, 540, 830, 'glow', '', { width: '420px', height: '420px', background: 'rgba(146,180,59,.35)' });
const hub = A(w1, 540, 830, 'orbA', svg('spark'), { width: '210px', height: '210px' });
hub.querySelector('svg').style.cssText = 'width:84px;height:84px';
const slots = ['t', 'r', 'b', 'l'].map(k => A(w1, P1[k][0], P1[k][1], 'slot'));
const tile = (k, icon, title, body) => A(w1, P1[k][0], P1[k][1], 'card tile', `<div class="tt">${ic(icon)}${title}</div>${body}`);
const tR = tile('t', 'search', 'بيبحث معاك', `<div class="sbar">${svg('search', 'style="width:28px;height:28px;stroke:#8A93A3;fill:none;stroke-width:2.4"')}<span class="q"></span></div>${[220, 260, 180].map(w => `<div class="res" style="width:${w}px"></div>`).join('')}`);
const tL = tile('r', 'book', 'تتعلم أسرع', `<div style="display:flex;align-items:center;gap:22px;margin-top:6px"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" stroke="#ECE8DD" stroke-width="14" fill="none"/><circle class="rg" cx="60" cy="60" r="48" stroke="#92B43B" stroke-width="14" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 60 60)"/></svg><div style="display:flex;flex-direction:column;gap:12px">${[110, 80, 100].map(w => `<div class="res" style="width:${w}px"></div>`).join('')}</div></div>`);
const tW = tile('l', 'sliders', 'طريقتك في شغلك', `<div style="display:flex;flex-direction:column;gap:34px;margin-top:18px;padding:0 10px">${[0, 1, 2].map(() => '<div class="trk"><i></i><div class="knob"></div></div>').join('')}</div>`);
const tT = tile('b', 'bolt', 'ينفذ تاسكات', `<div style="display:flex;flex-direction:column;gap:14px;margin-top:4px">${[200, 240, 170].map(w => `<div class="tsk"><div class="bx">${svg('check')}</div><div class="res" style="width:${w}px"></div></div>`).join('')}</div>`);

// ===== S2 — videos, designs, your website =====
const g2 = G[2]; const w2 = $(g2, 'world');
const art = A(w2, 540, 780, 'art');
const BLK = [];
const blk = (x, y, w, h, bg, r = 18) => { const e = A(w2, x, y, 'blk', '', { width: w + 'px', height: h + 'px', background: bg, borderRadius: r + 'px' }); BLK.push({ e, dx: (rnd() - .5) * 1400, dy: (rnd() - .5) * 1600, dr: (rnd() - .5) * 120 }); return e; };
// video (right half)
const vB = blk(770, 700, 380, 400, 'linear-gradient(135deg,#1E2D44,#33507a)', 26);
const vP = blk(770, 680, 110, 110, 'rgba(255,255,255,.95)', 55);
vP.innerHTML = svg('play', 'style="width:52px;height:52px;fill:#1E2D44;stroke:none;margin:29px 0 0 34px"');
const vBar = blk(770, 950, 320, 14, 'rgba(255,255,255,.3)', 7);
const vProg = $(vBar, '', '', { height: '14px', width: '0', borderRadius: '7px', background: '#92B43B' });
// design (left half)
const dBg = blk(310, 700, 380, 400, '#F4F1E8', 26);
const dC = blk(400, 600, 200, 200, '#92B43B', 100);
const d1 = blk(270, 760, 230, 26, '#1E2D44', 13);
const d2 = blk(240, 810, 170, 26, 'rgba(30,45,68,.35)', 13);
const d3 = blk(280, 900, 240, 70, '#1E2D44', 18);
const vTag = A(w2, 770, 1000 + 70, 'tag', 'فيديوهات');
const dTag = A(w2, 310, 1000 + 70, 'tag', 'تصميمات');
const br = browser(w2, 540, 1060, 940, 1060);

// ===== S3 — generative AI =====
const g3 = G[3]; const w3 = $(g3, 'world');
const genGlow = A(w3, 540, 820, 'glow', '', { width: '900px', height: '500px', background: 'rgba(146,180,59,.22)' });
const genT = A(w3, 540, 760, 'genT', 'Generative AI');
const genA = A(w3, 540, 960, 'genA', 'الذكاء الاصطناعي التوليدي');
const PTS = Array.from({ length: 70 }, () => { const a = rnd() * Math.PI * 2, r = 700 + rnd() * 500; return { el: A(w3, 540, 790, 'pt'), x: Math.cos(a) * r, y: Math.sin(a) * r * 1.3, tx: (rnd() - .5) * 760, ty: (rnd() - .5) * 120, d: rnd() }; });
const RING = ['image', 'video', 'chat', 'code', 'mic', 'slides', 'globe', 'pen'].map(k => A(w3, 540, 860, 'orbI', svg(k)));

// ===== S4 — how you learn (3D phone) =====
const g4 = G[4]; const w4 = $(g4, 'world p3d');
const phGlow = A(w4, 620, 960, 'glow', '', { width: '700px', height: '900px', background: 'rgba(146,180,59,.28)' });
const ph = phone(w4, 640, 930);
const pimg = ph.querySelector('img');
const CO = [['محاضرات مخصوص', 26.96, 520], ['كتيب لكل محاضرة', 28.9, 760], ['متابعة مستمرة', 30.83, 1000], ['أسئلتك مرحب بيها', 32.23, 1240]]
  .map(([tx, a, y]) => ({ el: A(w4, 250, y, 'callout', `<div class="ck">${svg('check')}</div>${tx}`), a, y }));

// ===== S5 — 300 particles =====
const g5 = G[5]; const w5 = $(g5, 'world');
const NUM = textPoints('300+', 560, { size: 460 });
const PAL = ['#92B43B', '#FBF9F4', '#8A93A3', '#B9DD5B', '#E08A3C', '#FBF9F4'];
const DP = NUM.map(([x, y], i) => ({ el: A(w5, 540, 800, 'dotP', '', { background: PAL[i % PAL.length] }), sx: (rnd() - .5) * 1300, sy: (rnd() - .5) * 1700, x, y, d: rnd(), dist: Math.hypot(x, y) }));
const grads = A(w5, 540, 1150, 'head md dk', 'خريج من مجالات مختلفة', { opacity: 0 });

// ===== S6 — CTA =====
const g6 = G[6]; const w6 = $(g6, 'world');
const slam = A(w6, 540, 640, 'slam', 'خصم دلوقتي');
const slamS = A(w6, 540, 820, 'head sm', 'الحق الفرصة', { color: 'rgba(251,249,244,.75)', fontWeight: 700 });
const cb = commentBox(w6, 540, 1080);
const plane = A(w6, 900, 1080, 'plane', svg('send'));
const rp = replyBubble(w6, 560, 1290, 'هنبعتلك تفاصيل الدبلومة', 'Smarter With AI');

function frame(t) {
  const dk = darkAt(t, DARK);
  chromeAt(C, t, T, dk);
  capsAt(caps, t);
  flash.style.opacity = t > 7.05 ? .85 * (1 - pr(t, 7.05, .35, 'lin')) : 0;

  // S0
  if (gz(g0, t, B[0], B[1], { first: true })) {
    const breathe = 1 + .025 * Math.sin(t * 2.2);
    const reveal = pr(t, .1, .9);
    const after = pr(t, 7.05, .8);
    cam(w0, 0, 0, L(1.06, 1, pr(t, 0, 3, 'io')) * L(1, 1.08, pr(t, 7.05, .9)) * L(1, 2.6, pr(t, 7.65, .45, 'io')));
    st(orb, { op: reveal, s: L(.6, 1, reveal) * breathe * L(1, 1.15, after) });
    st(glow0, { op: reveal * L(.7, 1, .5 + .5 * Math.sin(t * 2)) * L(1, 1.4, after) });
    r1.style.opacity = reveal; r2.style.opacity = reveal;
    r1.style.transform = `translate(-50%,-50%) rotateX(70deg) rotateZ(${t * 50}deg) scale(${L(.8, 1, reveal)})`;
    r2.style.transform = `translate(-50%,-50%) rotateY(68deg) rotateZ(${-t * 40}deg)`;
    // pane slams at 3.0, cracks 6.6, shatters 7.05
    if (t < 7.05) {
      const k = pr(t, 2.75, .32, 'back');
      const shake = t > 6.6 ? Math.sin(t * 95) * 5 * (1 - pr(t, 6.6, .45)) : (t > 3.05 && t < 3.3 ? Math.sin(t * 120) * 8 : 0);
      st(pane, { op: pr(t, 2.75, .12), y: (1 - k) * -1300, x: shake, s: 1 + (t > 3.9 && t < 4.1 ? .006 : 0) + (t > 4.35 && t < 4.55 ? .006 : 0) });
      pane.querySelector('.sheen').style.left = (L(-300, 1200, pr(t, 3.1, 1.4, 'io'))) + 'px';
      pane.querySelector('#cr').style.strokeDashoffset = 1 - pr(t, 6.6, .38);
    } else pane.style.opacity = 0;
    // cursor taps
    const ck = pr(t, 3.5, .45);
    const tap = t > 3.9 && t < 4.05 || t > 4.35 && t < 4.5 ? .88 : 1;
    st(curs, { op: ck * (1 - pr(t, 4.9, .3)), x: (1 - ck) * 260, y: (1 - ck) * 300, s: tap });
    rips.forEach((r, i) => { const a = i ? 4.35 : 3.9; const k = pr(t, a, .6); st(r, { op: t > a ? 1 - k : 0, s: L(.5, 4, k) }); });
    // brand mark enters, rams the glass
    const mk = pr(t, 5.3, .6, 'back');
    const hit = pr(t, 6.45, .6, 'io');
    st(markBig, { op: t < 5.3 ? 0 : cl(pr(t, 5.3, .3)) * (1 - pr(t, 7.0, .1)), s: L(.3, 1, mk) * L(1, .55, hit), y: L(-40, 0, mk) });
    SH.forEach(({ el, vx, vy, vr, vs }) => {
      if (t < 7.05) { el.style.opacity = 0; return; }
      const u = t - 7.05;
      st(el, { op: 1 - pr(t, 7.25, .55), x: vx * u * .9, y: vy * u * .9 + 900 * u * u, r: vr * u, s: 1 + vs * u, b: u * 10 });
    });
    shock.forEach((r, i) => { const a = 7.05 + i * .12; const k = pr(t, a, .9); st(r, { op: t > a ? (1 - k) * .9 : 0, s: L(1, 3.4, k) }); });
  }

  // S1
  if (gz(g1, t, B[1], B[2])) {
    // camera visits each capability, then pulls back
    const keys = [[8.0, 0, 0, 1.12], [10.5, 0, 0, 1.0], [10.92, 0, 300, 1.32], [12.45, -300, 0, 1.32], [13.92, 300, 0, 1.32], [15.55, 0, -320, 1.32], [16.9, 0, 0, 1.0]];
    let cx = 0, cy = 0, cs = 1;
    for (let i = 0; i < keys.length; i++) {
      const [tk, x, y, s] = keys[i];
      if (i === 0) { cx = x; cy = y; cs = s; continue; }
      const k = pr(t, tk - .1, .7, 'io');
      cx = L(cx, x, k); cy = L(cy, y, k); cs = L(cs, s, k);
    }
    cam(w1, cx, cy, cs);
    hubLines.style.opacity = 1; hubLines.style.transform = 'translate(-50%,-50%)';
    hubLines.querySelectorAll('.hl').forEach((p, i) => p.style.strokeDashoffset = 1 - pr(t, 9.4 + i * .15, .5));
    st(hub, { s: (1 + .04 * Math.sin(t * 3)) * pop(hub, t, 8.2, { s0: .3 }) });
    st(hubGlow, { op: .8 + .2 * Math.sin(t * 2) });
    slots.forEach((s, i) => { const k = pr(t, 9.6 + i * .15, .4); st(s, { op: k * (1 - pr(t, [10.92, 13.92, 15.55, 12.45][i], .2)), s: L(.8, 1, k) }); });
    pop(tR, t, 10.92, { s0: .7 });
    const q = 'إزاي أطوّر شغلي';
    tR.querySelector('.q').textContent = q.slice(0, Math.round(q.length * pr(t, 11.1, .7, 'lin')));
    tR.querySelectorAll('.res').forEach((e, i) => { const k = pr(t, 11.8 + i * .18, .4); e.style.transform = `scaleX(${k})`; e.style.transformOrigin = 'right'; e.style.background = k > .99 ? '#DCEBB5' : '#E9E5DA'; });
    pop(tL, t, 12.45, { s0: .7 });
    tL.querySelector('.rg').style.strokeDashoffset = 1 - pr(t, 12.7, 1.2) * .85;
    tL.querySelectorAll('.res').forEach((e, i) => e.style.transform = `scaleX(${pr(t, 12.8 + i * .2, .4)})`);
    pop(tW, t, 13.92, { s0: .7 });
    tW.querySelectorAll('.trk').forEach((e, i) => { const v = L(.15, [.8, .45, .65][i], pr(t, 14.2 + i * .25, .7, 'back')); e.querySelector('i').style.width = v * 100 + '%'; e.querySelector('.knob').style.left = (1 - v) * 100 + '%'; });
    pop(tT, t, 15.55, { s0: .7 });
    tT.querySelectorAll('.tsk').forEach((e, i) => {
      const k = pr(t, 15.95 + i * .38, .3, 'back'); const bx = e.querySelector('.bx');
      bx.style.background = k > .05 ? '#92B43B' : 'transparent'; bx.style.borderColor = k > .05 ? '#92B43B' : '#D5D0C4';
      bx.style.transform = `scale(${k > .05 ? L(.6, 1, k) : 1})`; bx.querySelector('svg').style.opacity = k;
      e.querySelector('.res').style.background = k > .05 ? '#DCEBB5' : '#E9E5DA';
    });
  }

  // S2
  if (gz(g2, t, B[2], B[3])) {
    const zoom = pr(t, 21.0, .9, 'io');
    cam(w2, 0, L(0, -160, zoom), L(1, .86, zoom));
    st(art, { op: pr(t, 17.6, .4) * (1 - zoom * .0), s: L(.9, 1, pr(t, 17.6, .6)) });
    BLK.forEach((b, i) => {
      const a = (b.e === vB || b.e === vP || b.e === vBar) ? 18.1 + i * .12 : 19.0 + (i - 3) * .12;
      const k = pr(t, a, .65, 'out');
      st(b.e, { op: cl(k * 3), x: (1 - k) * b.dx, y: (1 - k) * b.dy, r: (1 - k) * b.dr, s: L(.6, 1, k) });
    });
    vProg.style.width = pr(t, 18.8, 3, 'lin') * 100 + '%';
    pop(vTag, t, 19.3); pop(dTag, t, 19.95);
    rv(br, t, 21.1, { dy: 900, blur: 0, d: .8 });
    seq(br.querySelector('img'), 'A_vibe', t, 21.2);
  }

  // S3
  if (gz(g3, t, B[3], B[4])) {
    cam(w3, 0, 0, L(1.1, 1, pr(t, 22.6, 4, 'out')));
    const kT = pr(t, 23.2, .9, 'out');
    st(genT, { op: kT, s: L(1.6, 1, kT), b: (1 - kT) * 20 });
    genT.style.backgroundPosition = `${L(100, -50, pr(t, 23.6, 2.4, 'io'))}% 0`;
    rv(genA, t, 24.95, { dy: 40 });
    st(genGlow, { op: pr(t, 23.2, 1) * (.8 + .2 * Math.sin(t * 3)) });
    PTS.forEach(p => { const k = pr(t, 22.9 + p.d * .5, 1.3, 'io'); st(p.el, { op: k < .98 ? cl(k * 3) : 1 - pr(t, 24.4, .4), x: L(p.x, p.tx, k), y: L(p.y, p.ty, k), s: L(1.6, .6, k) }); });
    RING.forEach((e, i) => { const a = i / RING.length * Math.PI * 2 + t * .6; const k = pr(t, 24.2 + i * .07, .6, 'back'); const z = Math.sin(a); st(e, { op: k * L(.45, 1, (z + 1) / 2), x: Math.cos(a) * 430, y: 380 + z * 120, s: L(.75, 1.05, (z + 1) / 2) * k }); e.style.zIndex = z > 0 ? 5 : 1; });
  }

  // S4
  if (gz(g4, t, B[4], B[5])) {
    const k = pr(t, 26.7, 1.0, 'out');
    ph.style.opacity = k;
    ph.style.transform = `translate(-50%,-50%) translateY(${(1 - k) * 300}px) rotateY(${L(-32, -10, pr(t, 26.7, 7.5, 'io'))}deg) rotateX(${L(14, 4, k)}deg) rotateZ(${L(4, 0, k)}deg)`;
    st(phGlow, { op: k * (.8 + .2 * Math.sin(t * 2)) });
    if (t < 28.9) seq(pimg, 'A_list', t, 26.9);
    else if (t < 30.8) seq(pimg, 'A_book', t, 28.9);
    else seq(pimg, 'A_task', t, 30.8);
    CO.forEach(c => rv(c.el, t, c.a, { dx: -120, dy: 0, d: .5 }));
  }

  // S5
  if (gz(g5, t, B[5], B[6])) {
    cam(w5, 0, 0, L(1.08, 1, pr(t, 34.2, 6, 'out')));
    DP.forEach(p => {
      const k = pr(t, 34.7 + p.d * .7, 1.0, 'io');
      const drift = (1 - k) * 30 * Math.sin(t * 1.5 + p.d * 9);
      const wave = pr(t, 38.84 + p.dist / 900, .3);
      const el = p.el;
      st(el, { op: pr(t, 34.25 + p.d * .3, .3), x: L(p.sx, p.x, k) + drift, y: L(p.sy, p.y, k), s: 1 + .5 * Math.sin(Math.PI * wave) });
      if (wave > .5) el.style.background = '#92B43B';
    });
    rv(grads, t, 36.5, { dy: 30 });
  }

  // S6
  if (gz(g6, t, B[6], B[7], { last: true })) {
    const k = pr(t, 41.95, .45, 'back');
    st(slam, { op: pr(t, 41.95, .12), s: L(2.4, 1, k), r: L(-12, -3, k) });
    const sh = t > 42.1 && t < 42.4 ? Math.sin(t * 110) * 10 : 0;
    cam(w6, sh, 0, 1);
    rv(slamS, t, 42.45, { dy: 20 });
    commentAt(cb, t, 43.31, 'مهتم', 43.55, 44.15);
    const pk = pr(t, 44.15, .7, 'io');
    st(plane, { op: t > 44.15 ? 1 - pk : 0, x: pk * -700, y: pk * -500, r: -20 * pk, s: L(1, .5, pk) });
    pop(rp, t, 44.6, { s0: .6, y: Math.sin(t * 2) * 4 });
  }
}
