function frame(t) {
  const dk = darkAt(t, DARK);
  chromeAt(C, t, T, dk);
  capsAt(caps, t);
  const [cx, cy, cs] = camAt(t);
  const shake = (t > 3.0 && t < 3.3) || (t > 6.6 && t < 6.9) || (t > 42.1 && t < 42.4) ? Math.sin(t * 140) * 7 : 0;
  board.style.transform = `translate(${540 - cx * cs + shake}px,${960 - cy * cs}px) scale(${cs})`;

  // ---- Z1 ----
  P1.style.opacity = 1 - pr(t, 7.1, .5);
  [floor, floor2].forEach(f => { f.style.opacity = 1; f.style.transform = 'translate(-50%,-50%)'; f.style.borderTopColor = t < 7.2 ? 'rgba(251,249,244,.35)' : 'rgba(30,45,68,.22)'; f.style.background = t < 7.2 ? 'rgba(251,249,244,.06)' : 'rgba(30,45,68,.05)'; });
  rv(you, t, .2, { dx: 160, dy: 0, blur: 6 });
  const happy = pr(t, 7.2, .3);
  you.querySelector('.sad').style.opacity = 1 - happy; you.querySelector('.happy').style.opacity = happy;
  rv(lap1, t, .5, { dx: -160, dy: 0, blur: 6 });
  st(lapGlow, { op: pr(t, .6, .8) * (.6 + .3 * Math.sin(t * 2) + .3 * pr(t, 7.2, .4)) });
  lap1.querySelectorAll('.lb').forEach((b, i) => { const k = i < 2 ? pr(t, .9 + i * .3, .3) : pr(t, 7.6 + (i - 2) * .3, .3); b.style.opacity = k; b.style.transform = `scale(${L(.7, 1, k)})`; });
  pop(thought, t, 1.1, { s0: .3, y: Math.sin(t * 3) * 6 });
  thought.textContent = t < 7.25 ? '؟' : '✓'; thought.style.color = t < 7.25 ? '#E08A3C' : '#92B43B';
  // pillar up (≈"حاجز"), down on "هيتشال"
  const up = pr(t, 2.85, .28, 'back'), down = pr(t, 6.6, .45, 'io');
  pillar.style.transform = `translateY(${(1 - up) * 560 + down * 560}px)`;
  pw.style.opacity = 1; pw.style.transform = 'translate(-50%,-50%)';
  DUST.forEach(d => { let op = 0, x = 0, y = 0, s = 1; for (const b of [3.0, 6.75]) if (t > b && t < b + .9) { const u = t - b; op = 1 - u / .9; x = d.vx * u; y = d.vy * u + 300 * u * u; s = d.s * (1 + u); } st(d.el, { op: op * .8, x, y, s }); });
  msgs.forEach((m, i) => {
    const a = i ? 4.25 : 3.6, hit = a + .4;
    if (t < a || t > hit + .9) { m.style.opacity = 0; return; }

    else { const u = t - hit; st(m, { op: 1 - u / .9, x: -50 + 260 * u, y: -40 + 800 * u * u - 160 * u, r: 140 * u, s: i ? .8 : 1 }); }
  });
  const hx = Math.max(pr(t, 4.0, .2) * (1 - pr(t, 4.4, .2)), pr(t, 4.65, .2) * (1 - pr(t, 5.0, .2)));
  st(hitX, { op: hx, s: L(.5, 1, hx) });
  // the diploma builds the bridge, plank by plank from you to the AI
  PLANKS.forEach((p, i) => { const k = pr(t, i < 2 ? 5.45 + i * .18 : 6.78 + (i - 2) * .06, .32, 'back'); st(p.el, { op: cl(k * 2), y: (1 - k) * -120, s: L(.3, 1, k), r: p.ang }); });
  rail.style.strokeDashoffset = 1 - (pr(t, 5.45, .5) * .36 + pr(t, 6.8, .4) * .64);
  pop(keystone, t, 7.05, { s0: .3, y: Math.sin(t * 2.4) * 4 });
  BR.style.opacity = 1; BR.style.transform = 'translate(-50%,-50%)';
  FLOW.forEach((f, i) => { if (t < 7.25) { f.style.opacity = 0; return; } const q = (t - 7.25 - i * .22) / .9; if (q < 0) { f.style.opacity = 0; return; } const u = q % 1; const p = bpath.getPointAtLength(BLEN * (i % 2 ? 1 - u : u)); f.style.left = p.x + 'px'; f.style.top = (p.y + 500 - 34) + 'px'; st(f, { op: Math.sin(Math.PI * u) }); });

  // ---- Z2 ----
  lap2.style.opacity = pr(t, 8.0, .4); lap2.style.transform = `translate(-50%,-50%) scale(${.8 * L(.8, 1, pr(t, 8.0, .5, 'back'))})`;
  lap2.querySelectorAll('.lb').forEach((b, i) => { b.style.opacity = pr(t, 8.4 + i * .25, .3); });
  z2lines.style.opacity = 1; z2lines.style.transform = 'translate(-50%,-50%)';
  z2lines.querySelectorAll('.zl').forEach((p, i) => p.style.strokeDashoffset = 1 - pr(t, 9.3 + i * .15, .5));
  const CA = [10.92, 12.45, 13.92, 15.55];
  slots.forEach((s, i) => { const k = pr(t, 9.6 + i * .12, .4); st(s, { op: k * (1 - pr(t, CA[i], .2)), s: L(.85, 1, k) }); });
  [cR, cL, cW, cT].forEach((c, i) => pop(c, t, CA[i], { s0: .7 }));
  const q = 'إيه الجديد في مجالي؟';

  prm.querySelector('.gen').style.transform = `scale(${t > 18.85 && t < 19.05 ? .9 : 1})`;
  SPK.forEach(s => { const u = pr(t, 18.95, .6); st(s.el, { op: t > 18.95 ? 1 - u : 0, x: Math.cos(s.a) * s.r * u, y: Math.sin(s.a) * s.r * u, s: L(1, .3, u) }); });
  pop(vwin, t, 19.15, { s0: .8 });
  const vt = cl((t - 19.15) / 3.2);
  vwin.querySelector('#sun').setAttribute('cy', L(420, 190, E.out(cl((t - 19.15) / 1.4))));

  pop(vTag, t, 19.35);
